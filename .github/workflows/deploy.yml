# GitHub Pages 部署（04 §7.1）：push main / 手动触发
# shared-core pin 971b3e6（standard 模式：file:../shared-core，CI 内 clone + checkout）
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # standard 模式：clone shared-core 到 checkout 目录父级并 checkout pin（可重现构建）
      - name: Clone shared-core (pin 971b3e6)
        run: |
          git clone --depth 1 https://github.com/ProMatheus-ltsc/shared-core.git ../shared-core
          git -C ../shared-core fetch --depth 1 origin 971b3e6
          git -C ../shared-core checkout 971b3e6

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 先装 shared-core 依赖（peer 全声明，npm 7+ 自动安装；切勿 --legacy-peer-deps）
      - name: Install shared-core deps
        run: cd ../shared-core && npm install --no-audit --no-fund

      # 再装主项目依赖（npm ci 解析 file:../shared-core 本地依赖）
      - name: Install main project deps
        run: npm ci --no-audit --no-fund

      - name: Build (含 TS 类型检查；alias + dedupe 生产打包生效)
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
